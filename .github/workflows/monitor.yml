
name: WikiTree Category Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

concurrency:
  group: wikitree-category-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check WikiTree categories
        run: python monitor.py

      - name: Test Poland and Polska monitor
        run: python monitor_poland.py --self-test

      - name: Monitor Poland and Polska reports
        run: python monitor_poland.py

      - name: Save baselines and RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update Preußen category monitors"
            git push
          fi
